name: Build

### Every push is checked. Pushes to main also publish the image for the TrueNAS server:
###   ghcr.io/<owner>/kickbase-insights:latest
### Other branches get an image tagged with the branch name, to try them before merging.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install . ruff
      - name: Lint the new manager tools
        continue-on-error: true
        run: ruff check --extend-ignore E501 core/coach.py sync/automation.py sync/push.py api/coach_routes.py tests
      - name: Unit checks of the manager formulas
        run: python tests/check_coach.py
      - name: Smoke test against the demo Kickbase
        run: python tests/smoke_manager_tools.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check and build
        run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kickbase-insights
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=3.1.0-mgr.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
