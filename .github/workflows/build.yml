name: Build

### Every push is checked. Pushes to main also publish the image for the TrueNAS server:
###   ghcr.io/<owner>/kickbase-insights:latest
### Other branches get an image tagged with the branch name, to try them before merging.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install . ruff
      - name: Lint the new manager tools
        continue-on-error: true
        run: ruff check --extend-ignore E501 core/coach.py sync/automation.py sync/push.py api/coach_routes.py tests
      - name: Unit checks of the manager formulas
        run: python tests/check_coach.py
      - name: League settings, migrations and lineup bounds
        run: python tests/check_league_preferences.py
      - name: Wealth reconstruction
        run: python tests/check_wealth.py
      - name: Store lock between processes
        run: python tests/check_locks.py
      - name: Smoke test against the demo Kickbase
        run: python tests/smoke_manager_tools.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check and build
        run: npm run build

  ui-audit:
    permissions:
      contents: write
    ### Screenshots of every page on phones, tablet and desktop, plus an overflow report (artifact "ui-audit").
    ### Pinned to 24.04: Playwright's browsers lag behind the newest runner image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: |
          pip install ./backend
          cd frontend && npm ci --no-audit --no-fund && npm run build
      - name: Start the app in demo mode
        env:
          KBI_DEMO: "true"
          KBI_DATA_DIR: /tmp/kbi
          KBI_FRONTEND_DIR: ${{ github.workspace }}/frontend/dist
          KBI_PUSH__SUBJECT: mailto:test@example.org
          KBI_ALLOW__BALANCES_USERS: "1001"
        run: |
          cd backend && nohup python main.py start > /tmp/kbi.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -s -c /tmp/c -H 'Content-Type: application/json' -d '{"email":"demo@demo.de","password":"demo"}' http://127.0.0.1:8000/api/auth/login > /dev/null
          for i in $(seq 1 90); do curl -s -b /tmp/c http://127.0.0.1:8000/api/status | grep -q '"syncedAt":"' && break; sleep 2; done
      - name: Screenshots
        working-directory: tools/ui-audit
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          OUT=${{ github.workspace }}/ui-audit EXTRA_ROUTES="${{ vars.UI_AUDIT_EXTRA_ROUTES }}" node audit.mjs
      - name: App log
        if: always()
        run: tail -50 /tmp/kbi.log
      - name: Publish the screenshots to the ui-audit branch
        if: always()
        run: |
          cd ui-audit
          git init -q && git checkout -q -b ui-audit
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "UI audit of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ui-audit

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kickbase-insights
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=3.1.0-mgr.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
