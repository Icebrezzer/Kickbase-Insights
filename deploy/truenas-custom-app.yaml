### Kickbase Insights (Manager-Edition) als Custom App auf TrueNAS SCALE 25.10
### Apps -> Discover Apps -> ⋮ -> "Install via YAML", diesen Inhalt einfügen und die <...> ersetzen.
### Das Image baut GitHub Actions bei jedem Push auf main neu. Update: App -> "Update" bzw. neu deployen
### (pull_policy: always holt dann das neueste Image).

services:
  kickbase-insights:
    image: ghcr.io/icebrezzer/kickbase-insights:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Berlin
      ### Dein Kickbase-Konto: synchronisiert immer, sammelt den Tagesbonus und lässt deine Automatik
      ### dauerhaft laufen (Mitspieler laufen über ihre eigene Anmeldung in der App)
      KBI_KICKBASE__EMAIL: "<deine Kickbase-E-Mail>"
      KBI_KICKBASE__PASSWORD: "<dein Kickbase-Passwort>"
      ### Geschätzte Kontostände der anderen sieht nur, wer hier steht (Kickbase-Name oder ID)
      KBI_ALLOW__BALANCES: "false"
      KBI_ALLOW__BALANCES_USERS: "<dein Kickbase-Managername>"
      ### Hinter dem Reverse Proxy (HTTPS): sichere Cookies und echte Client-IPs
      KBI_API__FORWARDED_ALLOW_IPS: "*"
      ### Push aufs iPhone. Muss eine https-Adresse oder mailto: sein
      KBI_PUSH__SUBJECT: "https://kickbase.bananaflixx.eu"
      ### Verschlüsselt die gespeicherten Kickbase-Sitzungen. Einmal festlegen, nie wieder ändern
      ### (z. B. mit: openssl rand -hex 32)
      KBI_AUTH__SECRET_KEY: "<lange Zufallszeichenkette>"
    volumes:
      ### Datenbank, Push-Schlüssel und Sitzungen. Beim Wechsel vom Original-Image denselben Pfad
      ### wie bisher verwenden, dann bleiben alle Daten erhalten. Der Ordner muss UID 1000 gehören.
      - /mnt/<pool>/apps/kickbase-insights:/data
